name: Deploy CI Supabase migrations

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - "scripts/apply-ci-migrations.sh"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector-intelligence-supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    env:
      CI_SUPABASE_DB_URL: ${{ secrets.CI_SUPABASE_DB_URL }}
      CI_SUPABASE_PROJECT_REF: bwdafrwkimjvwfoqomot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check database secret
        id: configured
        shell: bash
        run: |
          if [[ -z "$CI_SUPABASE_DB_URL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CI_SUPABASE_DB_URL is not configured yet. No database changes will be made."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure PostgreSQL client
        if: steps.configured.outputs.configured == 'true'
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Apply Collector Intelligence migrations
        if: steps.configured.outputs.configured == 'true'
        shell: bash
        run: bash scripts/apply-ci-migrations.sh

      - name: Not configured yet
        if: steps.configured.outputs.configured != 'true'
        run: |
          echo "Pipeline installed but intentionally skipped."
          echo "Add the GitHub Actions secret CI_SUPABASE_DB_URL, then run this workflow manually once."
