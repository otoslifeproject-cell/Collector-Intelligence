name: Collector Intelligence Typecheck
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Matched-pair regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: TypeScript and Vite build
        run: npm run build
      - name: Install Chromium for layout inspection
        run: npx playwright install --with-deps chromium
      - name: Fresh owner journey — disposable browser test, no external provider
        run: |
          VITE_SUPABASE_URL=http://127.0.0.1:4173/fake VITE_SUPABASE_PUBLISHABLE_KEY=disposable-publishable-test-key npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/collector-fresh-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npx playwright test tests/box-fresh-browser.spec.mjs --reporter=line
      - name: Six-view layout and accessibility checks
        run: npx playwright test tests/ui-layout.spec.mjs --reporter=line
      - name: Preserve UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-research-layout-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
