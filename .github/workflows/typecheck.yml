name: Collector Intelligence Typecheck
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Matched-pair regression tests
        run: node --experimental-strip-types --test tests/pairGrouping.test.mjs
      - name: TypeScript and Vite build
        run: npm run build
