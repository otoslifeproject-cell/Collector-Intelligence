name: Continuity resolver fixtures
on:
  pull_request:
    paths:
      - 'tests/continuity/**'
      - '.github/workflows/continuity-resolver.yml'
  workflow_dispatch:
jobs:
  resolver-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed fixture tests
        run: |
          node tests/continuity/test.mjs
          node tests/continuity/multi-document.test.mjs
