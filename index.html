<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F14" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ci-appearance-v1');
          var theme = saved === 'light' || saved === 'dark' ? saved
            : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="description" content="Collector Intelligence — advanced AI-assisted object identification, evidence-led research, careful valuation and trusted collection intelligence." />
    <title>Collector Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
